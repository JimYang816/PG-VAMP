[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgvamp-ofdm"
version = "0.1.0"
description = "CP-OFDM PG-VAMP engineering foundation and independent references"
requires-python = ">=3.11"
dependencies = ["torch", "numpy", "PyYAML", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pgvamp-ofdm = "pgvamp_ofdm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pgvamp_ofdm = ["base.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
